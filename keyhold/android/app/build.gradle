plugins {
    id 'com.android.application'
}

// One version for the whole program: it is set in ../../main.go.
def versionMatch = (file('../../main.go').text =~ /version\s*=\s*"(\d+)\.(\d+)\.(\d+)"/)
if (!versionMatch.find()) throw new GradleException('No version found in main.go')
def (major, minor, patch) = (1..3).collect { versionMatch.group(it).toInteger() }

// Release signing comes from the environment (GitHub Actions secrets). Without it,
// only the debug build can be installed.
def keystore = System.getenv('KEYHOLD_KEYSTORE')

android {
    namespace 'id.zenzeiten.keyhold'
    compileSdk 36

    defaultConfig {
        applicationId 'id.zenzeiten.keyhold'
        minSdk 28
        targetSdk 36
        versionCode major * 10000 + minor * 100 + patch
        versionName "${major}.${minor}.${patch}"
    }

    // The web app is packed into the APK as it is: no copy, no build step.
    sourceSets {
        main {
            assets.srcDirs = [file('../../web')]
        }
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('KEYHOLD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEYHOLD_KEY_ALIAS')
                keyPassword System.getenv('KEYHOLD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
