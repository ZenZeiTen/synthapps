name: lintas

# Lintas runs on Windows only here: unit tests and a check that the preload bundle is current,
# then the Windows installers (installer and portable) as downloadable artifacts. No Linux or macOS
# runners are used. The end-to-end test of the real app (test/app.smoke.mjs) is run by hand before a
# release. The builds are not code-signed.
on:
  pull_request:
    paths:
      - "lintas/**"
      - ".github/workflows/lintas.yml"
  push:
    branches: [main]
    paths:
      - "lintas/**"
      - ".github/workflows/lintas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lintas
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Preload bundle is up to date
        run: node scripts/build-preload.mjs && git diff --exit-code --ignore-cr-at-eol app/preload/chrome.bundle.cjs

  build:
    name: Build (windows-latest)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lintas
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: lintas-windows
          path: |
            lintas/dist/Lintas-*-x64.exe
            lintas/dist/Lintas-*-arm64.exe
          if-no-files-found: error
