name: lintas

# Builds the Windows installer and portable app as downloadable artifacts, when run by hand.
# Releases are built by lintas-release.yml. The unit tests and the Electron smoke test run in
# the Claude Code container before pushing, not here: see CLAUDE.md, no Linux or macOS jobs in
# Actions, and no Linux or macOS builds of the app. The builds are not code-signed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lintas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: lintas-Windows
          path: lintas/dist/*.exe
          if-no-files-found: error
