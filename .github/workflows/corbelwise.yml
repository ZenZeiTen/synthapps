name: Corbelwise

# Runs only to publish a release. Tests (PHP lint and static checks, WordPress blocks, browser,
# MySQL smoke test) run in the Claude Code container before pushing, not here: see CLAUDE.md,
# no Linux test or build jobs in Actions.
on:
  # The "Run workflow" button on the Actions page, run on main: publishes release
  # corbelwise-v<Version from the theme's style.css>.
  workflow_dispatch:
  push:
    # Pushing a tag named corbelwise-v<version> also publishes that release.
    tags:
      - "corbelwise-v*"

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/corbelwise-v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag from the theme version
        run: |
          version="$(sed -n 's/^Version: *//p' corbelwise/theme/corbelwise/style.css | tr -d '[:space:]')"
          tag="corbelwise-v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the theme version $version." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Build the zips
        run: corbelwise/scripts/build-zips.sh
      - name: Create the release, or add the zips to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" corbelwise/dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false
            fi
          else
            gh release create "$TAG" corbelwise/dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Corbelwise ${TAG#corbelwise-v}" \
              --notes-file corbelwise/RELEASE_NOTES.md
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
