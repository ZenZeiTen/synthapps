name: gamepilot

# Windows only. Lint and the tests on Linux (and other Python versions) run in the Claude Code container
# before pushing, not here: see CLAUDE.md, no Linux or macOS jobs in Actions.
on:
  pull_request:
    paths:
      - "gamepilot/**"
      - ".github/workflows/gamepilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Windows, Python 3.13
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gamepilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests (standard library only)
        run: python -m unittest discover -s tests -t . -v
      - name: Demo game
        run: python -m synthapps_gamepilot demo
      - name: Tests with the real SDK installed
        run: |
          pip install "anthropic>=2.3" Pillow
          python -m unittest discover -s tests -t .
