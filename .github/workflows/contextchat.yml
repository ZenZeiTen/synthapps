name: ContextChat plugin

on:
  # The "Run workflow" button on the Actions page. With "Publish a release" ticked, a run on main
  # tests, builds and publishes release contextchat-v<Version from contextchat.php>.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in contextchat.php (run on main)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "contextchat/**"
      - ".github/workflows/contextchat.yml"
  push:
    branches: [main]
    # Pushing a tag named contextchat-v<version> builds, tests and publishes a release.
    # Path filters are not applied to tag pushes.
    tags:
      - "contextchat-v*"
    paths:
      - "contextchat/**"

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find contextchat -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php contextchat/tests/php/unit.php

  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contextchat
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: contextchat/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The end-to-end run asks WP-CLI whether WordPress would offer an update for this plugin.
      - name: Install WP-CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wp-cli.phar" https://github.com/wp-cli/wp-cli/releases/download/v2.11.0/wp-cli-2.11.0.phar
          php "$RUNNER_TEMP/wp-cli.phar" --version
          echo "WP_CLI=php $RUNNER_TEMP/wp-cli.phar" >> "$GITHUB_ENV"
      - run: npm run test:e2e -- "$RUNNER_TEMP/screens"
      # Report only: Update URI and the update filter keep a same-named WordPress.org plugin from
      # being offered here, but a taken slug is still a reason to consider renaming the plugin.
      - name: Is the contextchat slug taken on WordPress.org?
        run: |
          reply="$(curl -gsS -m 20 'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request[slug]=contextchat&request[fields][sections]=0' || true)"
          if [ -z "$reply" ] || ! jq -e . > /dev/null 2>&1 <<< "$reply"; then
            msg="Could not reach api.wordpress.org to check the contextchat slug."
          elif jq -e '.error' > /dev/null <<< "$reply"; then
            msg="The contextchat slug is free on WordPress.org ($(jq -r '.error' <<< "$reply"))."
          else
            msg="The contextchat slug is TAKEN on WordPress.org: $(jq -r '"\(.name) \(.version) by \(.author | gsub("<[^>]*>"; ""))" | gsub("[\\r\\n]"; " ")' <<< "$reply")."
            echo "::warning::$msg"
          fi
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextchat-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: contextchat-plugin
          path: contextchat/dist/*.zip

  release:
    name: Publish release
    # A pushed contextchat-v* tag, or the Run workflow button on main with "Publish a release" ticked.
    if: >-
      startsWith(github.ref, 'refs/tags/contextchat-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag from the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' contextchat/plugin/contextchat/contextchat.php | tr -d '[:space:]')"
          tag="contextchat-v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin version $version." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: contextchat-plugin
          path: files
      - name: Create the release, or add the zip to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A release made or drafted on GitHub's "Draft a new release" page: add the zip, and
            # publish it if it is still a draft.
            gh release upload "$TAG" files/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false
            fi
          else
            # Creates the tag on the tested commit when it does not exist yet (the Run workflow button).
            gh release create "$TAG" files/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ContextChat ${TAG#contextchat-v}" \
              --notes-file contextchat/RELEASE_NOTES.md
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
