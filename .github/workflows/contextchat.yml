name: ContextChat plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contextchat/**"
      - ".github/workflows/contextchat.yml"
  push:
    branches: [main]
    paths:
      - "contextchat/**"

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find contextchat -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php contextchat/tests/php/unit.php

  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contextchat
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: contextchat/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e -- "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextchat-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: contextchat-plugin
          path: contextchat/dist/*.zip
