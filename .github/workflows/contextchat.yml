name: ContextChat plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contextchat/**"
      - ".github/workflows/contextchat.yml"
  push:
    branches: [main]
    # Pushing a tag named contextchat-v<version> builds, tests and publishes a release.
    # Path filters are not applied to tag pushes.
    tags:
      - "contextchat-v*"
    paths:
      - "contextchat/**"

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find contextchat -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php contextchat/tests/php/unit.php

  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contextchat
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: contextchat/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e -- "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextchat-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: contextchat-plugin
          path: contextchat/dist/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/contextchat-v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' contextchat/plugin/contextchat/contextchat.php | tr -d '[:space:]')"
          if [ "contextchat-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin version $version." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: contextchat-plugin
          path: files
      - name: Create the release, or add the zip to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release drafted on GitHub's "Draft a new release" page already exists when this runs: upload into it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "ContextChat ${GITHUB_REF_NAME#contextchat-v}" \
              --notes-file contextchat/RELEASE_NOTES.md
          fi
