name: ZenZeiTen Visitor Guard

# Runs only to publish a release. Tests (PHP lint, unit, browser, WordPress smoke test) run in the
# Claude Code container before pushing, not here: see CLAUDE.md, no Linux test or build jobs in Actions.
on:
  # The "Run workflow" button on the Actions page, run on main: publishes release
  # visitor-sentinel-v<Version from zenzeiten-visitor-guard.php>.
  workflow_dispatch:
  push:
    # Pushing a tag named visitor-sentinel-v<version> also publishes that release.
    tags:
      - "visitor-sentinel-v*"

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/visitor-sentinel-v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag from the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' visitor-sentinel/zenzeiten-visitor-guard/zenzeiten-visitor-guard.php | tr -d '[:space:]')"
          tag="visitor-sentinel-v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Zip the plugin folder
        run: |
          mkdir -p files
          (cd visitor-sentinel && zip -qr "../files/zenzeiten-visitor-guard-$VERSION.zip" zenzeiten-visitor-guard -x '*.DS_Store')
          # WordPress installs the zip into its top folder, which must be the plugin slug.
          unzip -l "files/zenzeiten-visitor-guard-$VERSION.zip" | grep -q ' zenzeiten-visitor-guard/zenzeiten-visitor-guard.php$'
          ls -l files
      - name: Create the release, or add the zip to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A release made or drafted on GitHub's "Draft a new release" page: add the zip, and
            # publish it if it is still a draft.
            gh release upload "$TAG" files/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false
            fi
          else
            # Creates the tag on this commit when it does not exist yet (the Run workflow button).
            gh release create "$TAG" files/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZenZeiTen Visitor Guard ${TAG#visitor-sentinel-v}" \
              --notes-file visitor-sentinel/RELEASE_NOTES.md
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
