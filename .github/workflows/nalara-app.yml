name: Nalara desktop app

# Builds the double-click Windows executable, runs its self-test there, and keeps it as a downloadable artifact.
# Pushing a tag named nalara-v* also attaches it to a GitHub release. No Linux or macOS builds: see CLAUDE.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nalara/src/app/**"
      - "nalara/scripts/**"
      - "nalara/package.json"
      - "nalara/package-lock.json"
      - ".github/workflows/nalara-app.yml"
  push:
    tags:
      - "nalara-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            file: Nalara-win-x64.exe
            package: Nalara-win-x64.exe
    defaults:
      run:
        shell: bash
        working-directory: nalara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: nalara/package-lock.json
      - run: npm ci
      - run: npm run build:app -- --target ${{ matrix.target }}
      - name: Self-test the executable
        run: ./dist-app/${{ matrix.file }} --check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: nalara/dist-app/${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/nalara-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Create the release, or add the files to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on GitHub's "Draft a new release" page already exists when this runs: upload into it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/*/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/*/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nalara ${GITHUB_REF_NAME#nalara-v}" \
              --notes "Double-click executable for Windows. See nalara/README.md (Desktop app) for first-run warnings."
          fi
