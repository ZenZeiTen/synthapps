name: Nalara desktop app

# Builds the double-click executable on each operating system, runs its self-test there, and keeps the files as
# downloadable artifacts. Pushing a tag named nalara-v* also attaches them to a GitHub release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nalara/src/app/**"
      - "nalara/scripts/**"
      - "nalara/package.json"
      - "nalara/package-lock.json"
      - ".github/workflows/nalara-app.yml"
  push:
    tags:
      - "nalara-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            file: Nalara-linux-x64
            package: Nalara-linux-x64.tar.gz
          - os: windows-latest
            target: win-x64
            file: Nalara-win-x64.exe
            package: Nalara-win-x64.exe
          - os: macos-latest
            target: darwin-arm64
            file: Nalara-darwin-arm64
            package: Nalara-darwin-arm64.zip
          - os: macos-15-intel
            target: darwin-x64
            file: Nalara-darwin-x64
            package: Nalara-darwin-x64.zip
    defaults:
      run:
        shell: bash
        working-directory: nalara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: nalara/package-lock.json
      - run: npm ci
      - run: npm run build:app -- --target ${{ matrix.target }}
      - name: Self-test the executable
        run: ./dist-app/${{ matrix.file }} --check
      - name: Self-test the packaged Mac app
        if: startsWith(matrix.target, 'darwin')
        run: |
          rm -rf unpacked && mkdir unpacked
          ditto -x -k dist-app/${{ matrix.package }} unpacked
          codesign --verify --verbose unpacked/Nalara.app
          unpacked/Nalara.app/Contents/MacOS/Nalara --check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: nalara/dist-app/${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/nalara-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nalara ${GITHUB_REF_NAME#nalara-v}" \
            --notes "Double-click executables for Windows, macOS and Linux. See nalara/README.md (Desktop app) for first-run warnings."
