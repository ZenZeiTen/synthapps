name: retroglot

# Windows only. The Linux unit tests and the emulator browser test run in the Claude Code container
# before pushing, not here: see CLAUDE.md, no Linux or macOS jobs in Actions.
on:
  pull_request:
    paths:
      - "retroglot/**"
      - ".github/workflows/retroglot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Windows, Node 22
    runs-on: windows-latest
    defaults:
      run:
        working-directory: retroglot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
