name: ZenZeiTen Bastion

# Runs only to publish a release. Tests (PHP lint, unit, browser, WordPress smoke test) run in the
# Claude Code container before pushing, not here: see CLAUDE.md, no Linux test or build jobs in Actions.
on:
  # The "Run workflow" button on the Actions page, run on main: publishes release
  # bastion-v<Version from zenzeiten-bastion.php>.
  workflow_dispatch:
  push:
    # Pushing a tag named bastion-v<version> also publishes that release.
    tags:
      - "bastion-v*"

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/bastion-v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # WordPress offers updates by folder name. If WordPress.org ever hosts a plugin called
      # zenzeiten-bastion, sites would be offered it as an "update" that replaces this plugin.
      - name: Slug is free on WordPress.org
        run: |
          reply="$(curl -sSg --retry 3 'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request[slug]=zenzeiten-bastion')"
          echo "$reply" | head -c 300; echo
          if ! echo "$reply" | grep -q '"error"'; then
            echo "::error::WordPress.org hosts a plugin with the slug zenzeiten-bastion." >&2
            exit 1
          fi
      - name: Work out the release tag from the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' bastion/zenzeiten-bastion/zenzeiten-bastion.php | tr -d '[:space:]')"
          tag="bastion-v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the plugin version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Zip the plugin folder
        run: |
          mkdir -p files
          (cd bastion && zip -qr "../files/zenzeiten-bastion-$VERSION.zip" zenzeiten-bastion -x '*.DS_Store')
          # WordPress installs the zip into its top folder, which must be the plugin slug.
          unzip -l "files/zenzeiten-bastion-$VERSION.zip" | grep -q ' zenzeiten-bastion/zenzeiten-bastion.php$'
          ls -l files
      - name: Create the release, or add the zip to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" files/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false
            fi
          else
            gh release create "$TAG" files/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZenZeiTen Bastion ${TAG#bastion-v}" \
              --notes-file bastion/RELEASE_NOTES.md
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
