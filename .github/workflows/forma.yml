name: ZenZeiTen Forma

on:
  # The "Run workflow" button on the Actions page. With "Publish a release" ticked, a run on main
  # tests, builds and publishes release forma-v<Version from the theme's style.css>.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in theme/zenzeiten-forma/style.css (run on main)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "forma/**"
      - ".github/workflows/forma.yml"
  push:
    branches: [main]
    # Pushing a tag named forma-v<version> also tests, builds and publishes a release.
    # Path filters are not applied to tag pushes.
    tags:
      - "forma-v*"
    paths:
      - "forma/**"
      - ".github/workflows/forma.yml"

permissions:
  contents: read

jobs:
  static:
    name: PHP ${{ matrix.php }} lint and static checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3"]
    defaults:
      run:
        working-directory: forma
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: find theme plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Design tokens, contrast, patterns, text domains, versions, sizes
        run: php tests/static/run.php
      - name: Translation templates are up to date
        if: matrix.php == '8.3'
        run: |
          python3 scripts/make-pot.py
          git diff --exit-code -- theme/zenzeiten-forma/languages plugin/zenzeiten-forma-toolkit/languages

  wordpress:
    name: WordPress 6.5 (SQLite) blocks, browser and integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forma
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: forma/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: tests/run-wordpress-tests.sh "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  smoke:
    name: Latest WordPress + MySQL, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: none
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: forma/package-lock.json
      - name: Install MySQL client and test tools
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          cd forma && npm ci && npx playwright install --with-deps chromium
      - run: bash forma/tests/wordpress-smoke.sh
        env:
          WORK: ${{ runner.temp }}/wp-smoke

  build:
    name: Build zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: forma/scripts/build-zips.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forma-zips
          path: forma/dist/*.zip

  release:
    name: Publish release
    # A pushed forma-v* tag, or the Run workflow button on main with "Publish a release" ticked.
    if: >-
      startsWith(github.ref, 'refs/tags/forma-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [static, wordpress, smoke, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag from the theme version
        run: |
          version="$(sed -n 's/^Version: *//p' forma/theme/zenzeiten-forma/style.css | tr -d '[:space:]')"
          tag="forma-v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the theme version $version." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: forma-zips
          path: files
      - name: Create the release, or add the zips to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" files/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false
            fi
          else
            gh release create "$TAG" files/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZenZeiTen Forma ${TAG#forma-v}" \
              --notes-file forma/RELEASE_NOTES.md
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
