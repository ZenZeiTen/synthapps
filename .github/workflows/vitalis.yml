name: Vitalis

# Runs only to publish a release: builds the installable web app (PWA) and the Android app and publishes
# both. Unit tests and the type-check run in the Claude Code container before pushing, not here: see
# CLAUDE.md, no Linux test jobs in Actions. Two ways to publish:
#  - the "Run workflow" button on the Actions page, run on main: publishes release
#    vitalis-v<version in vitalis/package.json>, creating that tag on the commit it built;
#  - pushing a tag named vitalis-v<version>.
on:
  workflow_dispatch:
  push:
    tags:
      - "vitalis-v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish a release
    if: startsWith(github.ref, 'refs/tags/vitalis-v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vitalis
    steps:
      - uses: actions/checkout@v4
      - name: Check the version and the tag
        run: |
          version="$(jq -r .version package.json)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "vitalis-v$version" ]]; then
              echo "::error::Tag $tag does not match the version in vitalis/package.json ($version)." >&2
              exit 1
            fi
          else
            tag="vitalis-v$version"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Raise the version in vitalis/package.json to publish a new one." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: vitalis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Type-check, build and package the web app
        run: |
          npm run build
          (cd dist && zip -qr "../vitalis-web-$VERSION.zip" .)
      - name: Build the web app and copy it into the Android project
        run: npm run android:sync
      - name: Install the Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build a debug APK
        working-directory: vitalis/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Vitalis-$VERSION.apk"
          gh release create "$TAG" "Vitalis-$VERSION.apk" "vitalis-web-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vitalis $VERSION" \
            --notes "Vitalis health tracker $VERSION, in English and Bahasa Indonesia.

          - Android: download Vitalis-$VERSION.apk on the phone and open it. Android asks once to allow installs from your browser or file manager.
          - Web app: host the files in vitalis-web-$VERSION.zip on any HTTPS web server, open the address and choose Install app."
