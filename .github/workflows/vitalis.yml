name: Vitalis

# Tests the health tracker, builds the installable web app (PWA) and the Android app, and keeps both as
# downloadable artifacts. Pushing a tag named vitalis-v* also attaches them to a GitHub release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vitalis/**"
      - ".github/workflows/vitalis.yml"
  push:
    branches: [main]
    paths:
      - "vitalis/**"
      - ".github/workflows/vitalis.yml"
    tags:
      - "vitalis-v*"

permissions:
  contents: read

jobs:
  web:
    name: Test and build the web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitalis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: vitalis/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Package
        run: cd dist && zip -qr ../vitalis-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: vitalis-web
          path: vitalis/vitalis-web.zip

  android:
    name: Build the Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitalis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: vitalis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Build the web app and copy it into the Android project
        run: npm run android:sync
      - name: Install the Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build a debug APK
        working-directory: vitalis/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Vitalis-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vitalis-debug.apk
          path: vitalis/Vitalis-debug.apk

  release:
    name: Publish a release
    if: startsWith(github.ref, 'refs/tags/vitalis-v')
    needs: [web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/vitalis-web.zip out/Vitalis-debug.apk \
            --repo "$GITHUB_REPOSITORY" --title "Vitalis ${GITHUB_REF_NAME#vitalis-v}" \
            --notes "Vitalis health tracker. Install Vitalis-debug.apk on Android (allow installs from this source), or host the files in vitalis-web.zip on any HTTPS web server to install it as an app from the browser."
