[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthapps-gamepilot"
version = "0.1.0"
description = "An agent that plays Steam and emulated games with a virtual gamepad or keyboard and mouse, using Claude to see and decide"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
capture = ["mss>=9", "Pillow>=10"]
windows = ["vgamepad>=0.1"]
linux = ["evdev>=1.6"]
all = ["anthropic>=2.3", "mss>=9", "Pillow>=10", "psutil>=5", "vgamepad>=0.1; sys_platform == 'win32'", "evdev>=1.6; sys_platform == 'linux'"]

[project.scripts]
gamepilot = "synthapps_gamepilot.__main__:main"

[tool.setuptools]
packages = ["synthapps_gamepilot", "synthapps_gamepilot.backends"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"synthapps_gamepilot/planner.py" = ["E501"]  # the system prompt is prose
