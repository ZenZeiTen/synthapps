# Example: a game played by clicking on screen (Virtual Cottage 2, a cozy focus app on Steam).
# Claude clicks buttons it sees in the screenshot with mouse_to + MOUSE_LEFT; no key bindings
# are needed. Written from a screenshot of the game's main screen.

name = "Virtual Cottage 2"

[game]
title_contains = "VirtualCottage2"     # the window title shown in the taskbar
fps = 60

[input]
device = "kbm"                         # keyboard and mouse: clicking is the main control
focus_check = true

[pacing]
mode = "realtime"                      # nothing in it is time-critical, so no pause is needed

[bindings]
# none: everything is a click on a visible button

[agent]
goal = "Add a task named 'Water the plants' to the To-Do-List."
notes = """
The main screen shows a cozy room in the middle. Top left: the Focus timer (pause, stop,
finish, minus and plus one minute). Top right: the To-Do-List with 'New Task', 'New Group',
'Presets' and a delete icon. Bottom: room and decoration buttons on the left, the music player
in the middle, weather and settings on the right.
To type text into a field, click the field first, then press the letter keys (KEY_W, KEY_A ...,
KEY_SPACE for a space, KEY_LEFTSHIFT held with a letter for a capital) and KEY_ENTER to confirm.
Do not delete existing tasks and do not change the settings.
"""
effort = "low"
max_turns = 60
max_minutes = 15
max_cost_usd = 1.0
