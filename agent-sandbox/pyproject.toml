[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthapps-zenzeiworld"
version = "0.1.0"
description = "Reference kernel for a contained, embodied multi-agent sandbox world"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
synthapps-zenzeiworld = "synthapps_zenzeiworld.__main__:main"

[tool.setuptools]
packages = ["synthapps_zenzeiworld"]

[tool.setuptools.package-data]
synthapps_zenzeiworld = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "BLE"]

[tool.mypy]
strict = true
python_version = "3.11"
