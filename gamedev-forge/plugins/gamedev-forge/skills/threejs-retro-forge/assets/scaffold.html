<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Forge scaffold</title>
<!--
  Single-file runnable starting point. Serve over http (module imports need it):
      npx serve .     — or —     python3 -m http.server

  Budget in this scaffold (edit BUDGET below):
    res     320x240, integer upscale, letterboxed
    color   RGB555 (32 levels) + 4x4 ordered dither
    vertex  snapped to the 320x240 grid
    surface affine warp, nearest filtering, 64px texel density
    light   vertex-lit Gouraud, no specular
    signal  CRT TV — barrel + scanlines + aperture mask + halation + vignette
    anachronism: real-time halation bloom (impossible on the base hardware)

  Pin the three version deliberately. Check the current one with:
      curl -s https://registry.npmjs.org/three/latest
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #05060a; overflow: hidden;
    display: grid; place-items: center;
    font: 13px/1.4 ui-monospace, "Courier New", monospace; color: #9fb3c8;
  }
  canvas { display: block; image-rendering: pixelated; }
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 2;
    display: flex; gap: 8px; align-items: center;
  }
  #hud button {
    font: inherit; color: #cfe3f7; background: #10233a;
    border: 1px solid #2c4a70; padding: 5px 10px; cursor: pointer;
  }
  #hud button:focus-visible { outline: 2px solid #7fd6ff; outline-offset: 2px; }
</style>
</head>
<body>

<!-- Accessibility escape hatch. Not optional: several signal-chain effects are
     literally flashing lights, and someone needs to be able to read the page. -->
<div id="hud">
  <button id="toggleSignal" aria-pressed="true">CRT: on</button>
  <span id="info" role="status"></span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.185.1/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
// Adjust the path if you relocate the asset.
import { PSXMaterial, RetroPipeline, unstableSort } from './retro-glsl.js';

const BUDGET = {
  preset: 'psx',        // psx | n64 | arcade | vga | lcdClean | aero
  virtual: [320, 240],
  fogNear: 6,
  fogFar: 34,
  fogColor: 0x101828
};

const renderer = new THREE.WebGLRenderer({ antialias: false });
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, BUDGET.virtual[0] / BUDGET.virtual[1], 0.1, 200);
camera.position.set(0, 2.2, 7);

const pipeline = new RetroPipeline(renderer, BUDGET);

// --- a texture authored AT target size, not downscaled from something big ----
function checkerTexture(size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  for (let y = 0; y < size; y += 8) for (let x = 0; x < size; x += 8) {
    g.fillStyle = ((x + y) / 8) % 2 ? '#b8c6d9' : '#4a5a72';
    g.fillRect(x, y, 8, 8);
  }
  g.fillStyle = '#e2574c';
  g.fillRect(4, 4, 8, 8);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const tex = checkerTexture(64);
const matArgs = {
  map: tex,
  snapRes: new THREE.Vector2(...BUDGET.virtual),
  fogColor: BUDGET.fogColor, fogNear: BUDGET.fogNear, fogFar: BUDGET.fogFar,
  lightDir: new THREE.Vector3(0.35, 1.0, 0.5),
  ambient: 0x2b3348
};

// Floor: subdivided on purpose. Affine warp on a single huge quad is
// nauseating; tessellating localizes it, which is exactly what PS1 artists did.
const floorTex = tex.clone();
floorTex.needsUpdate = true;
floorTex.repeat.set(12, 12);
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(48, 48, 12, 12),
  new PSXMaterial({ ...matArgs, map: floorTex })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const spinners = [];
for (let i = 0; i < 7; i++) {
  const m = new THREE.Mesh(
    i % 2 ? new THREE.IcosahedronGeometry(0.9, 0) : new THREE.BoxGeometry(1.3, 1.3, 1.3),
    new PSXMaterial({ ...matArgs, color: i % 3 ? 0xffffff : 0xffc27a })
  );
  const a = (i / 7) * Math.PI * 2;
  m.position.set(Math.cos(a) * 4.5, 1.2 + (i % 3) * 0.5, Math.sin(a) * 4.5);
  scene.add(m);
  spinners.push(m);
}

// Stipple transparency: period-accurate, and it sidesteps sort order because
// discarded fragments never reach the blend stage.
const ghost = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 10, 8),
  new PSXMaterial({ ...matArgs, color: 0x8fe3ff, stipple: true, opacity: 0.45 })
);
ghost.position.set(0, 1.8, 0);
scene.add(ghost);

// --- sizing: integer scale, letterboxed remainder -----------------------------
function resize() {
  const r = pipeline.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = BUDGET.virtual[0] / BUDGET.virtual[1];
  camera.updateProjectionMatrix();
  document.getElementById('info').textContent =
    `${BUDGET.virtual[0]}x${BUDGET.virtual[1]} @${r.scale}x` +
    (r.scale < 3 ? ' — mask off (needs 3x)' : '');
}
window.addEventListener('resize', resize);
resize();

// --- loop: simulate at 30 fps, render every frame -----------------------------
// Interpolating every frame reads as modern; stepping reads as period.
const timer = new THREE.Timer();
const STEP = 1 / 30;
let acc = 0, t = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

renderer.setAnimationLoop(() => {
  timer.update();
  acc += Math.min(timer.getDelta(), 0.1);
  while (acc >= STEP) {
    t += STEP;
    if (!reduce) {
      spinners.forEach((m, i) => { m.rotation.x = t * 0.7 + i; m.rotation.y = t * 0.9; });
      camera.position.x = Math.sin(t * 0.25) * 2.2;
      camera.lookAt(0, 1.4, 0);
    }
    acc -= STEP;
  }
  unstableSort([ghost], camera);   // coarse depth buckets -> PS1 sort flicker
  pipeline.render(scene, camera, t);
});

// --- accessibility control ----------------------------------------------------
let signalOn = true;
const btn = document.getElementById('toggleSignal');
btn.addEventListener('click', () => {
  signalOn = !signalOn;
  pipeline.setSignalEnabled(signalOn);
  btn.textContent = `CRT: ${signalOn ? 'on' : 'off'}`;
  btn.setAttribute('aria-pressed', String(signalOn));
});
</script>
</body>
</html>
